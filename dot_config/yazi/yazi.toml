[mgr]
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
sort_translit  = false
linemode       = "size"
show_hidden    = false
show_symlink   = true
scrolloff      = 5
mouse_events   = ["click", "scroll"]
title_format   = "Yazi: {cwd}"

[preview]
tab_size        = 2
# Retina 全屏下调高采样上限，常规预览更锐
max_width       = 1800
max_height      = 2700
cache_dir       = ""
image_filter    = "triangle"
image_quality   = 75
sixel_fraction  = 15
ueberzug_scale  = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
	{ run = "${EDITOR:-vi} %s", desc = "$EDITOR", block = true, for = "unix" },
	{ run = "code %s", orphan = true, desc = "code", for = "windows" },
	{ run = "code -w %s", block = true, desc = "code (block)", for = "windows" },
]
open = [
	{ run = "xdg-open %s1", desc = "Open", for = "linux" },
	{ run = "open %s", desc = "Open", for = "macos" },
	{ run = 'start "" %s1', orphan = true, desc = "Open", for = "windows" },
]
pdf-study = [
	{ run = "sioyek %s", orphan = true, desc = "Sioyek · study", for = "macos" },
]
pdf-terminal = [
	{ run = "kittypdf %s1", block = true, desc = "kittypdf · terminal (default)", for = "unix" },
]
pdf-native = [
	{ run = "open -a Preview %s", orphan = true, desc = "Preview · edit/print", for = "macos" },
]
reveal = [
	{ run = "xdg-open %d1", desc = "Reveal", for = "linux" },
	{ run = "open -R %s1", desc = "Reveal", for = "macos" },
	{ run = "explorer /select,%s1", orphan = true, desc = "Reveal", for = "windows" },
	{ run = "clear; exiftool %s1; echo 'Press enter to exit'; read _", block = true, desc = "Show EXIF", for = "unix" },
]
extract = [
	{ run = "ya pub extract --list %s", desc = "Extract here" },
]
play = [
	{ run = "iina --no-stdin %s", orphan = true, for = "macos" },
	{ run = "mpv --force-window %s", orphan = true, for = "unix" },
	{ run = "mpv --force-window %s", orphan = true, for = "windows" },
	{ run = "mediainfo %s1; echo 'Press enter to exit'; read _", block = true, desc = "Show media info", for = "unix" },
]

[open]
rules = [
	# Folder
	{ mime = "inode/directory", use = ["edit", "open", "reveal"] },
	# Text
	{ mime = "text/*", use = ["edit", "reveal"] },
	# Books: kittypdf is the default PDF reader (falls through to Sioyek); r opens the full chooser.
	{ mime = "application/pdf", use = ["pdf-terminal", "pdf-study", "pdf-native", "reveal"] },
	{ mime = "application/epub+zip", use = ["open", "reveal"] },
	# Image
	{ mime = "image/*", use = ["open", "reveal"] },
	# Media
	{ mime = "{audio,video}/*", use = ["play", "reveal"] },
	# Archive
	{ mime = "application/{,g}zip", use = ["extract", "reveal"] },
	{ mime = "application/{tar,bzip*,7z*,xz,rar}", use = ["extract", "reveal"] },
	# JSON
	{ mime = "application/{json,ndjson}", use = ["edit", "reveal"] },
	{ mime = "*/javascript", use = ["edit", "reveal"] },
	# Empty file
	{ mime = "inode/empty", use = ["edit", "reveal"] },
	# Fallback
	{ mime = "*", use = ["edit", "open", "reveal"] },
]

[tasks]
micro_workers    = 10
macro_workers    = 25
bizarre_retry    = 5
image_alloc      = 536870912 # 512MB
image_bound      = [0, 0]
suppress_preload = false

[plugin]
preloaders = [
	# Image
	{ mime = "image/{avif,hei?,jxl,svg+xml}", run = "magick" },
	{ mime = "image/*", run = "image" },
	# Video
	{ mime = "video/*", run = "video" },
	# PDF
	{ mime = "application/pdf", run = "pdf" },
	# Font
	{ mime = "font/*", run = "font" },
	{ mime = "application/ms-opentype", run = "font" },
]
previewers = [
	{ url = "*/", run = "folder" },
	# Code
	{ mime = "text/*", run = "code" },
	{ mime = "*/{xml,javascript,x-wine-extension-ini}", run = "code" },
	# JSON
	{ mime = "application/{json,ndjson}", run = "json" },
	# Image
	{ mime = "image/{avif,hei?,jxl,svg+xml}", run = "magick" },
	{ mime = "image/*", run = "image" },
	# Video
	{ mime = "video/*", run = "video" },
	# PDF
	{ mime = "application/pdf", run = "pdf" },
	# Archive
	{ mime = "application/{,g}zip", run = "archive" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar,iso9660-image}", run = "archive" },
	# Font
	{ mime = "font/*", run = "font" },
	{ mime = "application/ms-opentype", run = "font" },
	# Empty file
	{ mime = "inode/empty", run = "empty" },
	# Fallback
	{ url = "*", run = "file" },
]

# fit.yazi（自研）：小图重采样放大铺满预览窗，大图走内建缩小；
# magick 缺失/失败回退内建渲染。avif/heic/jxl/svg 仍走下方 magick 管线
[[plugin.prepend_previewers]]
mime = "image/{jpeg,png,webp,gif,tiff,bmp}"
run = "fit"

# Tokyo Night preview pipeline: one wrapper owns the palette for Glow, Eza, and Bat.
[[plugin.prepend_previewers]]
url = "*.tar*"
run = 'piper --format=url -- sh "$HOME/.config/yazi/preview-tokyo-night.sh" archive "$1" "$w"'

[[plugin.prepend_previewers]]
url = "*.csv"
run = 'piper -- sh "$HOME/.config/yazi/preview-tokyo-night.sh" csv "$1" "$w"'

[[plugin.prepend_previewers]]
url = "*.md"
run = 'piper -- sh "$HOME/.config/yazi/preview-tokyo-night.sh" markdown "$1" "$w"'

[[plugin.prepend_previewers]]
url = "*/"
run = 'piper -- sh "$HOME/.config/yazi/preview-tokyo-night.sh" tree "$1" "$w"'

[[plugin.prepend_previewers]]
mime = "text/*"
run = 'piper -- sh "$HOME/.config/yazi/preview-tokyo-night.sh" text "$1" "$w"'

[[plugin.prepend_previewers]]
mime = "*/{xml,javascript,x-wine-extension-ini}"
run = 'piper -- sh "$HOME/.config/yazi/preview-tokyo-night.sh" text "$1" "$w"'

[[plugin.prepend_previewers]]
mime = "application/{json,ndjson}"
run = 'piper -- sh "$HOME/.config/yazi/preview-tokyo-night.sh" text "$1" "$w"'

[input]
cursor_blink = false

# cd
cd_title  = "Change directory:"
cd_origin = "top-center"
cd_offset = [0, 2, 50, 3]

# create
create_title  = ["Create:", "Create (dir):"]
create_origin = "top-center"
create_offset = [0, 2, 50, 3]

# rename
rename_title  = "Rename:"
rename_origin = "hovered"
rename_offset = [0, 1, 50, 3]

# trash
trash_title  = "Move {n} selected file{s} to trash? (y/N)"
trash_origin = "top-center"
trash_offset = [0, 2, 50, 3]

# delete
delete_title  = "Delete {n} selected file{s} permanently? (y/N)"
delete_origin = "top-center"
delete_offset = [0, 2, 50, 3]

# filter
filter_title  = "Filter:"
filter_origin = "top-center"
filter_offset = [0, 2, 50, 3]

# find
find_title  = ["Find next:", "Find previous:"]
find_origin = "top-center"
find_offset = [0, 2, 50, 3]

# search
search_title  = "Search via {n}:"
search_origin = "top-center"
search_offset = [0, 2, 50, 3]

# shell
shell_title  = ["Shell:", "Shell (block):"]
shell_origin = "top-center"
shell_offset = [0, 2, 50, 3]

# overwrite
overwrite_title  = "Overwrite an existing file? (y/N)"
overwrite_origin = "top-center"
overwrite_offset = [0, 2, 50, 3]

# quit
quit_title  = "{n} task{s} running, sure to quit? (y/N)"
quit_origin = "top-center"
quit_offset = [0, 2, 50, 3]

[pick]
open_title  = "Open with:"
open_origin = "hovered"
open_offset = [0, 1, 50, 7]

[which]
sort_by        = "none"
sort_sensitive = false
sort_reverse   = false
sort_translit  = false
