# vim:fileencoding=utf-8:foldmethod=marker

# https://sw.kovidgoyal.net/kitty/conf/

# ─────────────────────────────────────────────────────────────────────────────
# 扩展点 / 外部依赖清单（kitty 没有插件安装机制、也没有已装列表；这里如实盘点本
# 配置真正用到的东西，换机时照这份装即可。能扩展 kitty 的只有 kitten=Python 脚本）
#
# 内置 kitten（随 kitty 二进制分发，无需安装、无注册文件）:
#   • ssh                     — sessions/ssh.conf 的 6 个主机（cmd+ctrl+0/1/2/3/8/9）
#   • @ set-background-opacity — ⌥⌘U 透明度 toggle（走 remote control，见下方 map opt+cmd+u）
#   • choose-fonts            — 仅按需手动跑（见下方字体注释），未绑键
# 自定义 kitten（配置目录下的 *.py）: 无
#   ⚠️ tab_bar_style custom 需要目录里有 tab_bar.py(draw_tab)，本机从未有该文件 → 已
#      改用内置 powerline（见下方 tab bar 注释），别再改回 custom，否则静默回落 fade
# 主题: include tokyo-night.conf（纯 include 机制，非 `kitten themes` 注册，故不存在
#      current-theme.conf；备选 include oceanic-material.conf）
# 外部命令（非 kitty 组件，但被 launch 调起，换机需自行装）:
#   • im-select               — startup.conf 启动时切 Colemak 输入法（brew install im-select）
# 字体依赖: Hack Nerd Font Mono（装在 ~/Library/Fonts，需 Nerd Font 版本才有补全字形）
# ─────────────────────────────────────────────────────────────────────────────

startup_session startup.conf
# launch --type=background im-select com.apple.keylayout.Colemak

# font settings

# kitten choose-fonts
# <https://sw.kovidgoyal.net/kitty/kittens/choose-fonts/#font-spec-syntax>.

# socket-only: remote control (kitty @) 仅通过下面的显式 socket，不暴露给任意本地进程
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

# BEGIN_KITTY_THEME
# Tokyo Night（本地压黑版，官方色板见 tokyo-night.conf 头部注释）
# include oceanic-material.conf   # 旧主题，想切回就用这行
include tokyo-night.conf
# include current-theme.conf
# END_KITTY_THEME

font_family      Hack Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

# term xterm-256color # change the terminal type to xterm-256color

# if you want to connect ssh directly instead of using kitten ssh
# to prevent Kitty from displaying errors related to the terminal type, set a general configuration for TERM in .ssh/config file. 
# specify TERM=xterm-256color for your SSH sessions:
# Host *
#   SendEnv TERM
#   SetEnv TERM=xterm-256color

font_size 16.0

# window settings
# 空间体系（极致紧致）：外沿 margin 归零让玻璃贴到窗口边，内容只留 6pt 呼吸；分屏不用空隙，
# 靠 1pt 细边框分隔（0.5pt 在 Retina 上只有 1 物理像素，分屏时看不出焦点在哪）。
# 6pt 同时用作 tab 条左右留白 → tab 条首个胶囊的左沿与终端文字左沿对齐。
initial_window_width  1000
initial_window_height 650
single_window_margin_width 0
window_margin_width 0
window_padding_width 6
window_border_width 1pt

# 玻璃感：更透 + 轻磨砂（桌面轮廓可见）
# 桌面壁纸整体很暗（均色 #4d414c, L≈6%），却仍比 bg #12131a（L≈0.7%）亮约 9 倍，
# 所以「调亮」= 让底层多透上来：主杠杆降 opacity（tint 只在有背景图时才起作用，见下方复核）
#   composed = bg*(o + (1-o)*t) + wallpaper*(1-o)*(1-t)
#   旧 0.9/0.6 → 壁纸权重仅 4%（几乎纯 #12131a，所以发闷）
#   新 0.84/0.35 → 壁纸权重 ~12%，合成底色约 #191920（亮度 +≈40%）
# ⚠️ 2026-09-16 复核：0.48 文档写明 background_tint「只在设置了 background_image 时生效」，
# 而下面那行 background_image 是注释掉的 → tint 目前空转，上式里的 t 不参与合成，壁纸权重
# 实际只有 (1-opacity)=16%。想让玻璃更亮就继续降 background_opacity（0.80 → 20%），
# 或者打开 background_image 让 tint 真的生效。
background_opacity 0.84
dynamic_background_opacity yes
# background_image /etc/iterm2/bkg/wallhaven-668278.jpg
# blur 7→10：磨砂更匀一点，仍在「桌面轮廓可见」的轻磨砂区间（再往上桌面细节就糊掉了）
background_blur 10
background_tint 0.35
# 运行时切换：⌥⌘U 在「0.84 玻璃」⇄「1.0 不透明」之间 toggle（映射见下方 map opt+cmd+u）
hide_window_decorations titlebar-only

# 光标：细竖线 + 主题蓝渐隐轨迹（克制的动效）；未聚焦窗口文字淡化（视觉层次）
# beam 只作用于「程序没自己指定光标形状」的场合（vim/zsh 会按模式发 DECSCUSR）
cursor_shape beam
cursor_beam_thickness 1.5
cursor_trail 3
cursor_trail_color #7aa2f7
# 0.82：比 0.75 好读，又保留「当前 pane 一眼可辨」的层次（0.88 基本等于不淡化）
inactive_text_alpha 0.82

# 非活动窗口响铃时的描边用主题橙（默认 #ff5a00，跟色板里的 #ff9e64 不一路）
bell_border_color #ff9e64

map shift+cmd+i discard_event # 吞掉按键，拦截 raycast AI 默认快捷键

# 复制粘贴
copy_on_select yes
strip_trailing_spaces smart

# 标签页：powerline 圆角胶囊，Tokyo Night 官方 tab 色 + 层次法则（tab bar 比背景更暗）
# ⚠️ 原来的 custom 样式一直等于没生效：custom 要求配置目录里有 tab_bar.py（draw_tab），
# 本机没有该文件，kitty 加载失败后回落到默认 fade。powerline 是内置样式，圆角胶囊 +
# 左右留白，观感更整，且不依赖外部 py 文件。
# 非当前标签做成「比正文略亮的胶囊」（#24283b 底 + #a9b1d6 字）：层次法则守的是 tab 条本身
# 比正文更暗（#0d0e13），胶囊亮一档才能在暗条上被看见 —— 否则非当前页等于隐形。
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_bar_margin_width 6
tab_bar_margin_height 4 0
active_tab_font_style   bold
inactive_tab_font_style normal
active_tab_foreground   #16161e
active_tab_background   #7aa2f7
inactive_tab_foreground #a9b1d6
inactive_tab_background #24283b
tab_bar_background      #0d0e13
tab_bar_min_tabs 2
tab_title_max_length 32
# 标题：页码 + 布局首字母 + 铃铛(红)/活动(蓝)提示 + 路径末两级 + 分屏数（max_length 32 截断）
tab_title_template "{fmt.fg.tab} {index} [{layout_name[0].upper()}] {fmt.fg.red}{bell_symbol}{fmt.fg.tab}{fmt.fg._7aa2f7}{activity_symbol}{fmt.fg.tab}{'/'.join(title.rstrip('/').split('/')[-2:]) if '/' in title else title}{' · ' + str(num_windows) if num_windows > 1 else ''} "
# 活动圆点：非当前标签里有输出时，标题前点一个主题蓝圆点（喂给上面的 {activity_symbol}）
tab_activity_symbol "● "
# tab_title_template "{title.split()[0]} {title.split()[-1].split('/')[-1] if len(title.split()) > 1 else ''}"
# tab_title_template "{fmt.fg.red}{bell_symbol}{fmt.fg.tab}{title.split('/')[-1] if title.startswith('/') else title[:25]}{' +' if num_windows > 1 else ''} {fmt.fg._666666}{index}{fmt.fg.tab}"


# 滚动和历史
scrollback_lines 10000

# 滚动条（0.48 起内置，默认是裸样式）：只在回滚时出现，主题蓝胶囊手柄 + 全透明轨道，
# 悬停时轨道微亮、手柄变宽到 1 格宽。进度条（OSC 9;4）复用同一套样式与颜色，所以这里
# 也顺带定了进度条的色。
scrollbar scrolled
scrollbar_width 0.5
scrollbar_hover_width 1
scrollbar_radius 0.3
scrollbar_gap 0.15
scrollbar_min_handle_height 1.5
scrollbar_handle_color #7aa2f7
scrollbar_handle_opacity 0.45
scrollbar_track_color #7aa2f7
scrollbar_track_opacity 0
scrollbar_track_hover_opacity 0.12

# URL 处理（open_url_modifiers 在新版 kitty 已移除，用 mouse_map 等价实现 cmd+点击打开链接）
url_style dotted
mouse_map cmd+left release grabbed,ungrabbed mouse_handle_click link
mouse_map cmd+left press grabbed discard_event

# macos
# 标题栏跟随终端底色：默认 system 跟 macOS 外观走，浅色模式下深色终端顶上会挂一条亮灰
# 栏，很割裂；background 取当前窗口的背景色，暗色主题下与正文浑然一体。
macos_titlebar_color background

map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
map cmd+0 goto_tab 0

map cmd+enter toggle_fullscreen

map cmd+t new_tab_with_cwd

# map cmd+f send_text all \x1f
map cmd+f show_scrollback

# map f1 launch --stdin-source=@screen_scrollback --stdin-add-formatting --type=overlay less +G -R

# 背景透明切换（对齐 iTerm2 的 ⌘U「View ▸ Use Transparency」；kitty 侧裸 ⌘U 已给
# 「分屏上移」，故加 Option）。kitty 没有原生 toggle 键动作，只能借远程控制的 --toggle：
#   --allow-remote-control 必需（去掉后 toggle 静默失效，实测）
#   也不能写成 `map ... kitten @ ...`（map 的 kitten 动作按 kittens.<名> 找模块，报
#   No module named 'kittens.@'），必须走 launch 拉起真正的 kitten 可执行文件
#   --toggle 1 语义：当前是 1.0 就还原成 background_opacity，否则设为 1.0
map opt+cmd+u launch --type=background --allow-remote-control kitten @ set-background-opacity --toggle 1

# macos_option_as_alt no

# # 键盘映射
# map ctrl+shift+c copy_to_clipboard
# map ctrl+shift+v paste_from_clipboard
# map ctrl+shift+t new_tab
# map ctrl+shift+q close_tab
# map ctrl+shift+right next_tab
# map ctrl+shift+left previous_tab

map cmd+k clear_terminal to_cursor active

# https://sw.kovidgoyal.net/kitty/overview/#layouts
# https://sw.kovidgoyal.net/kitty/layouts/#arrange-windows
# enabled_layouts *
enabled_layouts splits,tall,fat

# 与 iTerm2 默认分屏键位对齐
map cmd+d launch --location=vsplit
map shift+cmd+d launch --location=hsplit

map cmd+s new_window
map shift+cmd+l next_layout
map shift+cmd+r layout_action rotate
map shift+cmd+w close_window

# map cmd+i next_window
# map cmd+n previous_window

map cmd+n neighboring_window left
map cmd+i neighboring_window right
map cmd+u neighboring_window up
map cmd+e neighboring_window down

map shift+up move_window up
map shift+left move_window left
map shift+right move_window right
map shift+down move_window down

# https://sw.kovidgoyal.net/kitty/layouts/#resizing-windows
map cmd+left resize_window narrower
map cmd+right resize_window wider
map cmd+up resize_window taller
map cmd+down resize_window shorter
# kitty @ resize-window --increment 5 --axis horizontal
# kitty @ resize-window --increment 2 --axis vertical

include sessions/ssh.conf
