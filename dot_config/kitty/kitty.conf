# vim:fileencoding=utf-8:foldmethod=marker

# https://sw.kovidgoyal.net/kitty/conf/

# ─────────────────────────────────────────────────────────────────────────────
# 扩展点 / 外部依赖清单（kitty 没有插件安装机制、也没有已装列表；这里如实盘点本
# 配置真正用到的东西，换机时照这份装即可。能扩展 kitty 的只有 kitten=Python 脚本）
#
# 内置 kitten（随 kitty 二进制分发，无需安装、无注册文件）:
#   • ssh                     — sessions/ssh.conf 的 6 个主机（cmd+ctrl+0/1/2/3/8/9）
#   • @ set-background-opacity — ⌥⌘U 透明度 toggle（走 remote control，见下方 map opt+cmd+u）
#   • choose-fonts            — 仅按需手动跑（见下方字体注释），未绑键
# 自定义标签栏: tab_bar.py（胶囊；复用内置标题格式化，逐 tab 绘制保留鼠标命中）
# 主题: include tokyo-night.conf（纯 include；备选 rose-pine-moon.conf / oceanic-material.conf）
# Shader: 内置 northern-lights + cursor-trail-lightning（默认开启；⌥⌘G 只切换极光）
# 自定义 kitten: toggle_aurora.py（读取运行时状态，启用 / 停用内置极光，不写盘）
# 外部命令（非 kitty 组件，但被 launch 调起，换机需自行装）:
#   • im-select               — startup.conf 启动时切 Colemak 输入法（brew install im-select）
#   • dsh / zsh / python3     — ai_chat.py：⌘⇧A / ⌘⇧E 打开 AI 分屏；加 ⌥ 则打开独立标签页
# 字体依赖: Hack Nerd Font Mono（装在 ~/Library/Fonts，需 Nerd Font 版本才有补全字形）
# ─────────────────────────────────────────────────────────────────────────────

startup_session startup.conf
# launch --type=background im-select com.apple.keylayout.Colemak

# font settings

# kitten choose-fonts
# <https://sw.kovidgoyal.net/kitty/kittens/choose-fonts/#font-spec-syntax>.

# socket-only: remote control (kitty @) 仅通过下面的显式 socket，不暴露给任意本地进程
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

# BEGIN_KITTY_THEME
# Tokyo Night · Frost Capsules（夜蓝画布、冰蓝胶囊、青蓝光标；保持既有样式）
# include rose-pine-moon.conf    # 暖紫 / 玫瑰配色备选
# include oceanic-material.conf
include tokyo-night.conf
# include current-theme.conf
# END_KITTY_THEME

font_family      Hack Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

# term xterm-256color # change the terminal type to xterm-256color

# if you want to connect ssh directly instead of using kitten ssh
# to prevent Kitty from displaying errors related to the terminal type, set a general configuration for TERM in .ssh/config file. 
# specify TERM=xterm-256color for your SSH sessions:
# Host *
#   SendEnv TERM
#   SetEnv TERM=xterm-256color

font_size 16.0
# 保留 Hack 的等宽节奏，略松行高，让长输出与中文不再挤在一起。
modify_font cell_height 108%

# Window: 8pt 留白，给胶囊和中文正文一点呼吸感。
# 外沿 margin 为零；留白跟随终端背景透明度，不另铺深色边框。
initial_window_width  1000
initial_window_height 650
single_window_margin_width 0
window_margin_width 0
window_padding_width 8
window_border_width 0

# 轻玻璃：稍多透出桌面、减弱磨砂，仍保留夜蓝底与文字对比。
# background_tint 只对背景图片生效，此处没有背景图片，因此不设置。
background_opacity 0.90
dynamic_background_opacity yes
background_blur 10
# ⌥⌘U 在「0.90 轻玻璃」⇄「1.0 不透明」之间切换。
hide_window_decorations titlebar-only

# 细青蓝光标 + 原生 Lightning 闪电拖尾；非活动正文轻微淡化，替代异色焦点框。
# beam 只作用于程序未自行指定光标形状的场合（vim/zsh 可按模式覆盖）。
cursor_shape beam
cursor_beam_thickness 1.5
cursor_trail 1
inactive_text_alpha 0.86

# 复制粘贴
copy_on_select yes
strip_trailing_spaces smart

# Tabs: 独立圆角胶囊；活动页冰蓝底、夜蓝字，其余页靛蓝灰底。
# 不加时钟 / 用户名等重复信息；单标签也显示，序号对应 ⌘1…9。
tab_bar_edge top
tab_bar_style custom
tab_bar_align left
tab_bar_margin_width 8
tab_bar_margin_height 6 4
active_tab_font_style   bold
inactive_tab_font_style normal
tab_bar_min_tabs 1
tab_title_max_length 32
# 保留与 ⌘1…9 对应的序号、路径末两级、必要的状态；去掉重复的布局字母。
# 状态符号沿用胶囊文字色，保持冰蓝底上的对比；overlay 不计入分屏数。
tab_title_template "{fmt.fg.tab}{index}  {bell_symbol}{activity_symbol}{secure_input_symbol}{'/'.join(title.rstrip('/').split('/')[-2:]) if '/' in title else title}{' · ' + str(num_window_groups) if num_window_groups > 1 else ''}"
tab_activity_symbol "· "

# 使用内置完整极光 pipeline 和 Lightning 拖尾；新启动的 Kitty 默认都开启。
# ⌥⌘G 只切换当前实例的极光，不影响拖尾；不写盘、不重启终端任务。
# custom_shaders northern-lights cursor-trail-lightning
# map opt+cmd+g kitten toggle_aurora.py


# 滚动和历史
scrollback_lines 10000

# 滚动条（0.48 起内置，默认是裸样式）：只在回滚时出现，冰蓝胶囊手柄 + 全透明轨道，
# 悬停时轨道微亮、手柄变宽到 1 格宽。进度条（OSC 9;4）复用同一套样式与颜色，所以这里
# 也顺带定了进度条的色。
scrollbar scrolled
scrollbar_width 0.5
scrollbar_hover_width 1
scrollbar_radius 0.3
scrollbar_gap 0.15
scrollbar_min_handle_height 1.5
scrollbar_handle_opacity 0.35
scrollbar_track_opacity 0
scrollbar_track_hover_opacity 0.12

# URL 处理（open_url_modifiers 在新版 kitty 已移除，用 mouse_map 等价实现 cmd+点击打开链接）
url_style dotted
mouse_map cmd+left release grabbed,ungrabbed mouse_handle_click link
mouse_map cmd+left press grabbed discard_event

# macos
# 标题栏跟随终端底色：默认 system 跟 macOS 外观走，浅色模式下深色终端顶上会挂一条亮灰
# 栏，很割裂；background 取当前窗口的背景色，暗色主题下与正文浑然一体。
macos_titlebar_color background

map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
map cmd+0 goto_tab 0

map cmd+enter toggle_fullscreen

map cmd+t new_tab_with_cwd

# map cmd+f send_text all \x1f
map cmd+f show_scrollback

# map f1 launch --stdin-source=@screen_scrollback --stdin-add-formatting --type=overlay less +G -R

# 背景透明切换（对齐 iTerm2 的 ⌘U「View ▸ Use Transparency」；kitty 侧裸 ⌘U 已给
# 「分屏上移」，故加 Option）。kitty 没有原生 toggle 键动作，只能借远程控制的 --toggle：
#   --allow-remote-control 必需（去掉后 toggle 静默失效，实测）
#   也不能写成 `map ... kitten @ ...`（map 的 kitten 动作按 kittens.<名> 找模块，报
#   No module named 'kittens.@'），必须走 launch 拉起真正的 kitten 可执行文件
#   --toggle 1 语义：当前是 1.0 就还原成 background_opacity，否则设为 1.0
map opt+cmd+u launch --type=background --allow-remote-control kitten @ set-background-opacity --toggle 1

# AI 持续对话：⌘⇧A 传入选区，⌘⇧E 传入上条命令输出（后者依赖 shell integration）。
# 默认在当前标签页开 AI pane，跟随 splits/tall/fat 布局；同标签页只复用一个 AI pane。
# 加 ⌥（⌘⌥⇧A / E）改开独立 AI 标签页，按工作目录单独复用，不与默认 pane 混用。
# 来源工作目录变化时先起新会话再替换旧 AI pane；旧会话历史仍由 dsh 保存，不串项目上下文。
# 首次和后续都只将英文来源说明 + 原文放进输入框，不自动发送；自行补充问题后按发送键。
# 空输入只打开 / 聚焦；用现有 ⌘N/I/U/E 切换 pane 可保持进程，⌘⇧W 则真正关闭 AI pane。
# 新建 AI 窗口先打印 dsh 启动命令，再叠加 ai.patch.yml（默认模型、禁用 MCP）；无额外模型偏好隔离。
# 仅过滤 Electron 的 task_name_for_pid failure (5) 原生诊断；其他 stderr 照常显示。
# /model、/effort 与普通 TUI 共用；已保存的选择可覆盖 patch 中的部署默认值。
# 本地 socket 追加草稿，不模拟按键；审批 / 弹窗期间可能无法接收，请确认草稿已出现。
# 最多传入 48 KB 纯文本，不预设任务；上下文提示不是权限隔离，密钥和敏感信息请先脱敏。
map cmd+shift+a launch --type=background --cwd=current --allow-remote-control --stdin-source=@selection /bin/sh -c 'exec python3 "$HOME/.config/kitty/ai_chat.py" selection "$1" pane' kitty-ai @active-kitty-window-id
map cmd+shift+e launch --type=background --cwd=current --allow-remote-control --stdin-source=@last_cmd_output /bin/sh -c 'exec python3 "$HOME/.config/kitty/ai_chat.py" output "$1" pane' kitty-ai @active-kitty-window-id
map cmd+opt+shift+a launch --type=background --cwd=current --allow-remote-control --stdin-source=@selection /bin/sh -c 'exec python3 "$HOME/.config/kitty/ai_chat.py" selection "$1" tab' kitty-ai @active-kitty-window-id
map cmd+opt+shift+e launch --type=background --cwd=current --allow-remote-control --stdin-source=@last_cmd_output /bin/sh -c 'exec python3 "$HOME/.config/kitty/ai_chat.py" output "$1" tab' kitty-ai @active-kitty-window-id

# macos_option_as_alt no

# # 键盘映射
# map ctrl+shift+c copy_to_clipboard
# map ctrl+shift+v paste_from_clipboard
# map ctrl+shift+t new_tab
# map ctrl+shift+q close_tab
# map ctrl+shift+right next_tab
# map ctrl+shift+left previous_tab

map cmd+k clear_terminal to_cursor active

# https://sw.kovidgoyal.net/kitty/overview/#layouts
# https://sw.kovidgoyal.net/kitty/layouts/#arrange-windows
# enabled_layouts *
enabled_layouts splits,tall,fat

# 与 iTerm2 默认分屏键位对齐；新分屏继承当前 pane 的工作目录
map cmd+d launch --cwd=current --location=vsplit
map shift+cmd+d launch --cwd=current --location=hsplit

map cmd+s new_window
map shift+cmd+l next_layout
map shift+cmd+r layout_action rotate
map shift+cmd+w close_window

# map cmd+i next_window
# map cmd+n previous_window

map cmd+n neighboring_window left
map cmd+i neighboring_window right
map cmd+u neighboring_window up
map cmd+e neighboring_window down

map shift+up move_window up
map shift+left move_window left
map shift+right move_window right
map shift+down move_window down

# https://sw.kovidgoyal.net/kitty/layouts/#resizing-windows
map cmd+left resize_window narrower
map cmd+right resize_window wider
map cmd+up resize_window taller
map cmd+down resize_window shorter
# kitty @ resize-window --increment 5 --axis horizontal
# kitty @ resize-window --increment 2 --axis vertical

include sessions/ssh.conf
