# Rosé Pine Moon · Capsules
# Palette: https://github.com/rose-pine/kitty/blob/main/dist/rose-pine-moon.conf (MIT)
# 原版 ANSI 色板；交互强调色与胶囊外观是本地调整。

background #232136
foreground #e0def4
selection_background #44415a
selection_foreground #e0def4
url_color #9ccfd8
cursor #ea9a97
cursor_text_color #232136
cursor_trail_color #ea9a97

# 玫瑰色活动胶囊，其他标签保持低对比的紫灰色。
