# Tokyo Night · Mist
# Palette: https://github.com/folke/tokyonight.nvim
# 保留 Tokyo Night 的语义色；界面统一夜蓝底，冰蓝文字标记焦点。
# 外观颜色统一放在这里；布局、透明度和交互见 kitty.conf。

# Canvas / text
background #1a1b26
foreground #c0caf5
selection_background #283457
selection_foreground #c0caf5
url_color #7dcfff
cursor #7aa2f7
cursor_text_color #1a1b26
cursor_trail_color #7aa2f7

# Tabs: 所有标签与正文同底色；只用冰蓝字 / 字重区分当前页。
# none 让导航轨道和边距继承终端背景，不做异色底块。
active_tab_background #1a1b26
active_tab_foreground #7aa2f7
inactive_tab_background #1a1b26
inactive_tab_foreground #828bb8
tab_bar_background none
tab_bar_margin_color none

# Panes: 不画异色框；焦点交给正文亮度，不再围出独立色块。
active_border_color none
inactive_border_color #1a1b26
bell_border_color #ff9e64

# Scrollbar: 与光标共享冰蓝强调色
scrollbar_handle_color #7aa2f7
scrollbar_track_color #7aa2f7

# Normal
color0 #15161e
color1 #f7768e
color2 #9ece6a
color3 #e0af68
color4 #7aa2f7
color5 #bb9af7
color6 #7dcfff
color7 #a9b1d6

# Bright
color8  #414868
color9  #ff899d
color10 #9fe044
color11 #faba4a
color12 #8db0ff
color13 #c7a9ff
color14 #a4daff
color15 #c0caf5

# Extended
color16 #ff9e64
color17 #db4b4b
