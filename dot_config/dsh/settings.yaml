ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
agent-default-model:
  provider: deepseek-official
  model: deepseek-v4-flash
  reasoningEffort: max
# DeepSeek 官方适配器（deepseek-official 路由）。settings 分节按字段覆盖 entry 配置，
# 但 `models` 是**数组、整体替换**（不是逐条追加）：省略时只公布内置目录的
# deepseek-v4-flash / deepseek-v4-pro / deepseek-v4-flash-vision-exp 三条，
# 所以这里照抄这三条的内置元数据，再追加限时内测的 V4.1 Flash
# （deepseek-v4.1-flash-expires-on-0910，id 自带过期日 2026-09-10），
# 让它出现在模型选择器 / 模型列表里。
# 未列出的 model id 仍原样透传给协议（纯文本路由），只是不出现在可选列表。
llm-deepseek:
  models:
    - id: deepseek-v4-flash
      name: DeepSeek-V4-Flash
      description: Fast, efficient, and economical; suited to focused, routine, or parallel tasks.
      contextWindow: 1000000
    - id: deepseek-v4-pro
      name: DeepSeek-V4-Pro
      description: Stronger agentic coding, knowledge, and difficult reasoning; suited to complex or quality-critical tasks at higher cost.
      contextWindow: 1000000
    - id: deepseek-v4-flash-vision-exp
      name: DeepSeek-V4-Flash-Vision-Exp
      contextWindow: 1000000
      inputModalities:
        - text
        - image
      imagePixelBudget: 640000
      imageMaxBytes: 1048576
    # 尚未进入内置目录的限时内测模型；不写 contextWindow 会落 defaultContextWindow（同为 1M），
    # 不写 maxTokens 则沿用路由默认（256000），与它当前未登记时的行为一致。
    - id: deepseek-v4.1-flash-expires-on-0910
      name: DeepSeek-V4.1-Flash (Beta)
      description: Limited-time V4.1 Flash beta; the id carries its own expiry date, so requests stop working after 2026-09-10.
      contextWindow: 1000000
llm-pi-ai:
  providers:
    zai-coding-cn:
      apiKeyEnv: ZAI_CODING_CN_API_KEY
      # GLM-5.3 尚未进入本机捆绑目录（pi-ai 0.82.1），故手动声明模型列表。
      # models 是整体替换：前六个照抄内置目录以保留其元数据，最后追加 glm-5.3。
      models:
        - id: glm-4.5-air
        - id: glm-4.7
        - id: glm-5-turbo
        - id: glm-5.1
        - id: glm-5.2
        - id: glm-5v-turbo
        - id: glm-5.3
          contextWindow: 1000000
          maxTokens: 131072
          # 官方（pi-ai 0.84.3 目录 + bigmodel 文档）：仅 low/high/max 三档思考，
          # 0.84.3 起 supportsReasoningEffort 为 true，覆盖路由级 false（glm-4.x 才不支持 effort）。
          reasoningEfforts:
            low: low
            high: high
            max: max
          compat:
            supportsReasoningEffort: true
        - id: glm-5.3-flash
          # 官方文档：1M 上下文、输出上限同 glm-5.3（128K）；GLM-5 系首个原生多模态
          # 模型；thinking.type 仅支持 enabled，reasoning_effort 三档同 glm-5.3。
          # maxTokens 必须显式声明，否则落 harness 兜底 32768，长输出中途截断。
          contextWindow: 1000000
          maxTokens: 131072
          input:
            - text
            - image
          reasoningEfforts:
            low: low
            high: high
            max: max
          compat:
            supportsReasoningEffort: true
      compat:
        supportsStore: false
        supportsDeveloperRole: false
        supportsReasoningEffort: false
        maxTokensField: max_tokens
        thinkingFormat: zai
# /vim 输入框 vim 模式键位（colemak，映射同 nvim lua/r1v3r/keymaps.lua）。
# vimKeys 机制由本地 pnpm patch 提供（profiles/dsh-tui/patches/，随 0.10.0-beta.5 锁定，
# 升级 TUI 需重做补丁）。j 未映射仍为下行，0/$/^/w/b/x/X/d/a/A/o/O 保持原义。
dsh-tui:
  vimKeys:
    left: n
    down: e
    up: u
    right: i
    wordEnd: h
    undo: l
    insert: k
    insertFirstNonBlank: K
    lineStart: N
    lineEnd: I
# Web 终端字体：Nerd Font 图标 + 中文兜底（better-sidebar 底部终端 / dsh-ssh SSH 终端）
dsh-better-sidebar:
  terminalFontFamily: 'Hack Nerd Font Mono, "LXGW WenKai Mono", monospace'
dsh-ssh:
  terminalFontFamily: 'Hack Nerd Font Mono, "LXGW WenKai Mono", monospace'
pet:
  visible: true
  size: 160
  right: 198
  bottom: 1207
  petId: whale-girl
  enabled: false
ui-theme:
  preference: system
skin-custom-theme:
  applied: false
