ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
agent-default-model:
  provider: deepseek-official
  model: deepseek-flash
  reasoningEffort: max
# DeepSeek 官方适配器（deepseek-official 路由）。dsh 0.1.5-rc.1 的内置目录已含
# deepseek-flash（= DeepSeek-V4.1-Flash，text+image），故**不再手写 models**：
# 手写列表是整体替换，会连带丢掉 0.1.5 新增的 systemPromptUpdate: in-history
# （agent loop 靠它决定系统提示词改动是否按 in-history 提交；丢了就只有首位
# system 消息生效）。旧名 deepseek-v4-flash / v4-pro / vision-exp 仍在内置目录里
# 作为兼容项。唯一要补的是输出上限：内置条目没写 maxTokens，会落路由默认 256000，
# 而官方上限是 384K=393216（API 实测回显 [1, 393216]），故在路由级抬高。
llm-deepseek:
  maxTokens: 393216
llm-pi-ai:
  providers:
    zai-coding-cn:
      apiKeyEnv: ZAI_CODING_CN_API_KEY
      # GLM-5.3 尚未进入本机捆绑目录（pi-ai 0.82.1），故手动声明模型列表。
      # models 是整体替换：前六个照抄内置目录以保留其元数据，最后追加 glm-5.3。
      models:
        - id: glm-5.3
          contextWindow: 1000000
          maxTokens: 131072
          # 官方（pi-ai 0.84.3 目录 + bigmodel 文档）：仅 low/high/max 三档思考，
          # 0.84.3 起 supportsReasoningEffort 为 true，覆盖路由级 false（glm-4.x 才不支持 effort）。
          reasoningEfforts:
            low: low
            high: high
            max: max
          compat:
            supportsReasoningEffort: true
        - id: glm-5.3-flash
          # 官方文档：1M 上下文、输出上限同 glm-5.3（128K）；GLM-5 系首个原生多模态
          # 模型；thinking.type 仅支持 enabled，reasoning_effort 三档同 glm-5.3。
          # maxTokens 必须显式声明，否则落 harness 兜底 32768，长输出中途截断。
          contextWindow: 1000000
          maxTokens: 131072
          input:
            - text
            - image
          reasoningEfforts:
            low: low
            high: high
            max: max
          compat:
            supportsReasoningEffort: true
      compat:
        supportsStore: false
        supportsDeveloperRole: false
        supportsReasoningEffort: false
        maxTokensField: max_tokens
        thinkingFormat: zai
    # traex_bridge：本机 Trae→OpenAI 网关（code.byted.org/hepengcheng/traex_bridge），
    # 复用 ~/.trae/cli/auth.json 的 Trae 授权，无需单独登录。容器监听 127.0.0.1:8317，
    # 说 openai-responses 协议（POST {baseURL}/responses，实测 SSE 流式 / developer 角色 /
    # reasoning.effort / max_output_tokens 均通）。pi-ai 目录没有这些模型，故整段手写声明。
    # 仅暴露用户指定的 6 个模型，不多带。maxTokens 必须显式声明，否则落 harness 兜底 32768
    # 长输出中途截断；上游不回显输出上限，65536 为实测可接受的稳妥每请求默认输出上限。
    traex:
      apiKeyEnv: TRAEX_BRIDGE_API_KEY
      displayName: TraeX Bridge
      api: openai-responses
      baseURL: http://127.0.0.1:8317/v1
      # 私有网关 URL 无法被 pi-ai 识别，其探测会按公有 OpenAI 兜底；这两个开关显式声明，
      # 保证向 reasoning 模型发 developer 角色系统提示、并带上 max_output_tokens。
      compat:
        supportsDeveloperRole: true
        supportsMaxOutputTokens: true
      models:
        # GPT-5.6-Sol：ctx 272K，默认 medium，思考四档 low/medium/high/xhigh。
        - id: GPT-5.6-Sol
          contextWindow: 272000
          maxTokens: 65536
          reasoningEfforts:
            low: low
            medium: medium
            high: high
            xhigh: xhigh
        # GPT-5.6-Sol[1m]：同 Sol，1M 长上下文变体（ctx 800K）。方括号是字面 id，需引号。
        - id: "GPT-5.6-Sol[1m]"
          contextWindow: 800000
          maxTokens: 65536
          reasoningEfforts:
            low: low
            medium: medium
            high: high
            xhigh: xhigh
        # GPT-6-Astra：ctx 272K，默认 medium，思考四档同 Sol。
        - id: GPT-6-Astra
          contextWindow: 272000
          maxTokens: 65536
          reasoningEfforts:
            low: low
            medium: medium
            high: high
            xhigh: xhigh
        # GPT-6-Astra[1m]：Astra 的 1M 长上下文变体（ctx 1000K）。
        - id: "GPT-6-Astra[1m]"
          contextWindow: 1000000
          maxTokens: 65536
          reasoningEfforts:
            low: low
            medium: medium
            high: high
            xhigh: xhigh
        # openrouter-3o：ctx 200K，默认 xhigh，思考五档（多一档 max）；上游 repo_restricted +
        # usage_limited（有配额，网关 /v1/models 可查剩余额度）。
        - id: openrouter-3o
          contextWindow: 200000
          maxTokens: 65536
          reasoningEfforts:
            low: low
            medium: medium
            high: high
            xhigh: xhigh
            max: max
        # openrouter-3o[1m]：openrouter-3o 的 1M 长上下文变体（ctx 1000K），思考五档同上。
        - id: "openrouter-3o[1m]"
          contextWindow: 1000000
          maxTokens: 65536
          reasoningEfforts:
            low: low
            medium: medium
            high: high
            xhigh: xhigh
            max: max
# /vim 输入框 vim 模式键位（colemak，映射同 nvim lua/r1v3r/keymaps.lua）。
# vimKeys 机制由本地 pnpm patch 提供（profiles/dsh-tui/patches/，随 0.10.2 锁定，
# 升级 TUI 需重做补丁）。j 未映射仍为下行，0/$/^/w/b/x/X/d/a/A/o/O 保持原义。
dsh-tui:
  vimKeys:
    left: n
    down: e
    up: u
    right: i
    wordEnd: h
    undo: l
    insert: k
    insertFirstNonBlank: K
    lineStart: N
    lineEnd: I
# Web 终端字体：Nerd Font 图标 + 中文兜底（better-sidebar 底部终端 / dsh-ssh SSH 终端）
dsh-better-sidebar:
  terminalFontFamily: 'Hack Nerd Font Mono, "LXGW WenKai Mono", monospace'
dsh-ssh:
  terminalFontFamily: 'Hack Nerd Font Mono, "LXGW WenKai Mono", monospace'
pet:
  visible: true
  size: 160
  right: 198
  bottom: 1207
  petId: whale-girl
  enabled: false
ui-theme:
  preference: system
skin-custom-theme:
  applied: false
