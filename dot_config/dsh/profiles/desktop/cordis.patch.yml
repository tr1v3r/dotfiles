# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: zai-coding-cn
    model: glm-5.3
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    purpose: both
    process: detailed
    completion: completed
    usage: detailed
    developerTools: true
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: detailed
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      zai-coding-cn:
        apiKeyEnv: ZAI_CODING_CN_API_KEY
      # models 必须是对象数组（schema: z.array(z.object({ id: ... }))）：
      # 纯字符串会让整个 llm-pi-ai 分节校验失败 → 全部 pi-ai 路由一起消失。
      # 另：声明 models 是整体替换，目录里其它 codex 模型不再出现在选择器里。
      openai-codex:
        models:
          # 桌面内置目录（pi-ai 0.85.1）已有：只写 id，其余元数据自动继承
          - id: gpt-6-astra
          - id: gpt-5.6-sol
          # 0.87.1 才收录，0.85.1 目录没有：必须整段手写，否则落兜底 262144/32768
          - id: gpt-6-luna
            name: GPT-6 Luna
            contextWindow: 272000
            maxTokens: 128000
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              minimal: low
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: gpt-6-sol
            name: GPT-6 Sol
            contextWindow: 272000
            maxTokens: 128000
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              minimal: low
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
      traex:
        apiKeyEnv: TRAEX_BRIDGE_API_KEY
        displayName: TraeX Bridge
        api: openai-responses
        baseURL: http://127.0.0.1:8317/v1
        compat:
          supportsDeveloperRole: true
          supportsMaxOutputTokens: true
        models:
          - id: GPT-5.6-Sol
            contextWindow: 272000
            maxTokens: 65536
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
          - id: GPT-5.6-Sol[1m]
            contextWindow: 800000
            maxTokens: 65536
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
          - id: GPT-6-Astra
            contextWindow: 272000
            maxTokens: 65536
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
          - id: GPT-6-Astra[1m]
            contextWindow: 1000000
            maxTokens: 65536
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
          - id: openrouter-3o
            contextWindow: 200000
            maxTokens: 65536
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: openrouter-3o[1m]
            contextWindow: 1000000
            maxTokens: 65536
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-08-13.1
- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek-api-key"
  config:
    maxTokens: 393216
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: system
- id: locale
  name: "@deepseek-ai/dsh-client-locale"
  config:
    preference: zh
# Maintainer Mode v0: Standard-compatible toolset with a repository-maintenance persona.
- insert:
    - id: preset-maintainer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: maintainer
        name: 维护者
        description: 自主完成本地开发闭环，在公开 Git 与发布动作前确认
        order: 1.5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You are a coding agent powered by the {{model}} model, operating in Maintainer Mode.

                Complete repository-local development work autonomously with minimal user
                interruption. Before changing code, read applicable workspace and repository
                instructions, inspect the relevant implementation and repository state, and
                determine the narrowest appropriate validation commands. Resolve discoverable
                facts by inspection rather than asking the user.

                Make the smallest coherent change. Add or update tests for behavioral changes.
                Run focused validation first and broader checks when justified. Continue fixing
                failures caused by your changes instead of returning a partially verified result.
                Before completion, review the final diff for correctness, unrelated changes,
                generated files, credentials, and missing tests. Report commands actually run,
                their outcomes, remaining risks, and any unverified assumptions.

                Local investigation, editing, testing, formatting, building, and creation of
                local branches or worktrees may proceed without conversational confirmation when
                consistent with repository instructions. Do not commit, push, create or update a
                pull request, merge, tag, publish, release, or deploy without explicit user
                authorization for that specific action. Never force-push a branch already
                associated with a pull request. Do not overwrite or discard pre-existing user
                changes.
              suffix: Your working directory is {{cwd}}.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: >
                    You are in plan mode. Stay in plan mode until exit_plan_mode
                    succeeds or the user switches the session mode. Imperative
                    language to implement changes means plan the implementation, not
                    execute it. A user's conversational agreement — including an
                    answer confirming something you asked — approves nothing and
                    does not end plan mode; fold the confirmed decision into the
                    plan and submit it through exit_plan_mode.


                    Explore first. Use non-mutating reads, searches, static
                    analysis, and checks to ground the plan in the actual
                    repository. Do not edit or write files, change configuration,
                    run formatters or code generation that rewrites tracked files,
                    commit, or otherwise carry out the plan. Prefer existing
                    functions and patterns over new machinery.


                    The tool catalog stays the same across modes for request-cache
                    stability. These plan-mode rules override any later tool
                    description or guidance that suggests using mutation tools;
                    those tools remain listed to keep the tool catalog unchanged. Do
                    not use todo_write to track this planning phase: it tracks
                    implementation after an approved plan, while the plan itself
                    belongs in exit_plan_mode.


                    Resolve discoverable facts by inspection. Use ask_user_question
                    only for user-owned choices or material ambiguity that
                    inspection cannot answer. Do not ask the user where code lives
                    or how current behavior works when you can find out.


                    Make the plan decision-complete: state the goal and success
                    criteria; group implementation changes by subsystem; identify
                    public API, schema, and data-flow changes; cover edge cases,
                    failure modes, tests, acceptance criteria, and explicit
                    assumptions. Keep it concise enough to review but detailed
                    enough that another engineer can implement it without making
                    design decisions.


                    When ready, call exit_plan_mode with the complete plan markdown,
                    starting with a # title. Make exit_plan_mode the only and final
                    tool call in that assistant response: it presents the plan for
                    approval, and implementation begins only in a later step after
                    approval. Do not paste the final plan as a plain reply or ask
                    "should I proceed?" through prose or ask_user_question. If
                    review rejects it, incorporate the feedback and present again.
                    If the review channel is unavailable or aborted, stay in plan
                    mode and ask the user to switch modes manually; do not proceed
                    with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
