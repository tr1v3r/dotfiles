# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: zai-coding-cn
    model: glm-5.3
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    purpose: both
    process: detailed
    completion: completed
    usage: detailed
    developerTools: true
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: detailed
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      zai-coding-cn:
        apiKeyEnv: ZAI_CODING_CN_API_KEY
      openai-codex: {}
      traex:
        apiKeyEnv: TRAEX_BRIDGE_API_KEY
        displayName: TraeX Bridge
        api: openai-responses
        baseURL: http://127.0.0.1:8317/v1
        compat:
          supportsDeveloperRole: true
          supportsMaxOutputTokens: true
        models:
          - id: GPT-5.6-Sol
            contextWindow: 272000
            maxTokens: 65536
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
          - id: GPT-5.6-Sol[1m]
            contextWindow: 800000
            maxTokens: 65536
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
          - id: GPT-6-Astra
            contextWindow: 272000
            maxTokens: 65536
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
          - id: GPT-6-Astra[1m]
            contextWindow: 1000000
            maxTokens: 65536
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
          - id: openrouter-3o
            contextWindow: 200000
            maxTokens: 65536
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
          - id: openrouter-3o[1m]
            contextWindow: 1000000
            maxTokens: 65536
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-08-13.1
- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek-api-key"
  config:
    maxTokens: 393216
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: system
- id: locale
  name: "@deepseek-ai/dsh-client-locale"
  config:
    preference: zh
